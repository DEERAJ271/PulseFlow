name: Weather ETL Pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Extract weather data
        run: python extract/fetch_weather.py

      - name: Transform and load into DuckDB
        run: python extract/transform_load.py

      - name: Commit and push weather.duckdb if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/weather.duckdb
          if git diff --cached --quiet; then
            echo "No changes to data/weather.duckdb"
          else
            git commit -m "Update weather data"
            git push
          fi
